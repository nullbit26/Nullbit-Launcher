name: Build & Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: core
        run: npm install

      - name: Build & Publish
        working-directory: core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run publish
